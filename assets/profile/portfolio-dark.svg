<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450"><rect width="1200" height="450" rx="18" fill="#0d1117"/><rect x="1" y="1" width="1198" height="448" rx="17" fill="none" stroke="#30363d"/><style>.title{font:700 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f0f6fc;letter-spacing:.5px}.kicker{font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#9fb7d4;letter-spacing:2px}.big{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f0f6fc}.label{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#8b949e}.row{font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f0f6fc}.count{font:700 14px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#9fb7d4}.note{font:500 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#8b949e}</style><text x="44" y="42" class="kicker">REPOSITORY SIGNALS</text><text x="44" y="76" class="title">A portfolio organized by systems, not by isolated demos.</text><rect x="44" y="104" width="246" height="88" rx="12" fill="#161b22" stroke="#30363d"/><text x="62" y="145" class="big">57</text><text x="62" y="174" class="label">owned repositories</text><rect x="314" y="104" width="246" height="88" rx="12" fill="#161b22" stroke="#30363d"/><text x="332" y="145" class="big">16</text><text x="332" y="174" class="label">curated public systems</text><rect x="584" y="104" width="246" height="88" rx="12" fill="#161b22" stroke="#30363d"/><text x="602" y="145" class="big">6</text><text x="602" y="174" class="label">recurring domains</text><rect x="854" y="104" width="246" height="88" rx="12" fill="#161b22" stroke="#30363d"/><text x="872" y="145" class="big">2</text><text x="872" y="174" class="label">flagship systems</text><text x="44" y="232" class="kicker">CURATED PUBLIC SYSTEMS BY DOMAIN</text><text x="44" y="278" class="row">Agent runtimes</text><rect x="360" y="266" width="690" height="14" rx="7" fill="#21262d"/><rect x="360" y="266" width="690" height="14" rx="7" fill="#9fb7d4" opacity="0.92"/><text x="1080" y="278" class="count">4</text><text x="44" y="303" class="row">Digital-asset intelligence</text><rect x="360" y="291" width="690" height="14" rx="7" fill="#21262d"/><rect x="360" y="291" width="517" height="14" rx="7" fill="#9fb7d4" opacity="0.84"/><text x="1080" y="303" class="count">3</text><text x="44" y="328" class="row">Wallets &amp; payment protocols</text><rect x="360" y="316" width="690" height="14" rx="7" fill="#21262d"/><rect x="360" y="316" width="345" height="14" rx="7" fill="#9fb7d4" opacity="0.76"/><text x="1080" y="328" class="count">2</text><text x="44" y="353" class="row">On-chain worlds</text><rect x="360" y="341" width="690" height="14" rx="7" fill="#21262d"/><rect x="360" y="341" width="345" height="14" rx="7" fill="#9fb7d4" opacity="0.68"/><text x="1080" y="353" class="count">2</text><text x="44" y="378" class="row">Developer tools</text><rect x="360" y="366" width="690" height="14" rx="7" fill="#21262d"/><rect x="360" y="366" width="517" height="14" rx="7" fill="#9fb7d4" opacity="0.60"/><text x="1080" y="378" class="count">3</text><text x="44" y="403" class="row">Research communication</text><rect x="360" y="391" width="690" height="14" rx="7" fill="#21262d"/><rect x="360" y="391" width="345" height="14" rx="7" fill="#9fb7d4" opacity="0.52"/><text x="1080" y="403" class="count">2</text><text x="44" y="435" class="note">Counts reflect the systems intentionally surfaced in this profile; private and incidental repositories are not enumerated.</text></svg>